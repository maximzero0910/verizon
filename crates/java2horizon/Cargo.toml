[package]
name = "java2horizon"
version = "0.4.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Java2Horizon - Java/Fabric mod compatibility layer for Horizon"

[dependencies]
jni = { version = "0.21", features = ["invocation"] }
once_cell = "1.19"
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
horizon-core = { path = "../horizon-core" }
horizon-mods = { path = "../horizon-mods", default-features = false }
ureq = { version = "2", default-features = false, features = ["tls"] }
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
regex = { version = "1", default-features = false, features = ["std", "unicode-perl"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
